name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: nxPanels version and client
      description: Output of /nxp status
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Retail, WoW Forever]
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Client language
      placeholder: frFR, zhCN, enUS...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error (BugSack / BugGrabber)
      render: text
