# Monthly pull request that updates the GitHub Actions used by the workflows
# (pinned by commit, the version stays readable in the comment). Merge it when the Tests pass.
# Not covered: lua-language-server (.github/actions/setup-lua) and the embedded Libs (tools/check-libs.sh).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
