name: Release

# A version tag (1.0.0-alpha.2, 1.0.0-beta.1, 1.0.0...) builds the package with the
# BigWigs packager and publishes it: GitHub release always, CurseForge only when the
# CF_API_KEY secret exists. Tags containing "alpha" or "beta" give alpha / beta files.
# "Run workflow" by hand builds the zip without publishing anything (test build).

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Static check and offline scenarios
        run: bash tools/tests/run-all.sh luajit

      - name: Test build (no upload)
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d

      - name: Package and publish
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          # File label on CurseForge: nxPanels-1.1.1 (the packager default is the bare version)
          args: -p 1444518 -n ":{package-name}-{project-version}{classic}{nolib}"

      - name: Keep the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nxPanels-package
          path: .release/*.zip
          include-hidden-files: true
