name: Tests

# Every push and pull request: Lua syntax, static check (tools/lint.sh) and offline scenarios.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-lua
      - name: Syntax check
        run: |
          status=0
          while read -r f; do luajit -bl "$f" > /dev/null || status=1; done < <(find nxPanels nxPanels_Options nxPanels_Import kgPanels_Reloaded -name '*.lua')
          exit $status
      - name: Static check and offline scenarios
        run: bash tools/tests/run-all.sh luajit
